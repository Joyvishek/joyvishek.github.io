<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="container">
    <a class="back-link" href="../index.html">&larr; All Games</a>
    <h1>Whack-a-Mole</h1>

    <div class="stats">
        <div>
            <div class="stat-label">Time</div>
            <div class="stat-value" id="time">30</div>
        </div>
        <div>
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div>
            <div class="stat-label">Best</div>
            <div class="stat-value" id="best">0</div>
        </div>
    </div>

    <div class="status" id="status">Click Start to play!</div>

    <div class="board" id="board"></div>

    <button class="restart-btn" id="start">Start</button>
</div>
</body>
</html>
