<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - Player vs Bot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <a class="back-link" href="../index.html">&larr; All Games</a>
        <h1>Tic-Tac-Toe</h1>

        <div class="mode-tabs">
            <button class="mode-tab active" id="vsBotTab" data-mode="bot">vs Bot</button>
            <button class="mode-tab" id="vsFriendTab" data-mode="friend">vs Friend</button>
        </div>

        <div class="controls">
            <div class="toggle-container" id="goFirstContainer">
                <span class="toggle-label">Go First (X):</span>
                <div class="toggle-switch active" id="goFirstToggle"></div>
            </div>
        </div>

        <p class="status" id="status">Your turn (X)</p>

        <div class="score-board">
            <div class="score">
                <div class="score-label" id="score1Label">You</div>
                <div class="score-value player-score" id="playerScore">0</div>
            </div>
            <div class="score">
                <div class="score-label">Draws</div>
                <div class="score-value draw-score" id="drawScore">0</div>
            </div>
            <div class="score">
                <div class="score-label" id="score2Label">Bot</div>
                <div class="score-value bot-score" id="botScore">0</div>
            </div>
        </div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="restart-btn" id="restart">New Game</button>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
