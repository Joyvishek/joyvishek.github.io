<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="container">
    <a class="back-link" href="../index.html">&larr; All Games</a>
    <h1>Snake</h1>

    <div class="stats">
        <div>
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div>
            <div class="stat-label">Best</div>
            <div class="stat-value" id="best">0</div>
        </div>
    </div>

    <div class="status" id="status">Use arrow keys or WASD</div>

    <canvas id="board" width="400" height="400"></canvas>

    <div class="touch-controls">
        <button class="touch-btn touch-up" id="up" aria-label="Up">&uarr;</button>
        <div class="touch-row">
            <button class="touch-btn touch-left" id="left" aria-label="Left">&larr;</button>
            <button class="touch-btn touch-down" id="down" aria-label="Down">&darr;</button>
            <button class="touch-btn touch-right" id="right" aria-label="Right">&rarr;</button>
        </div>
    </div>

    <button class="restart-btn" id="restart">New Game</button>
</div>
</body>
</html>
